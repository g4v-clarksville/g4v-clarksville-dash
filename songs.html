<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chapter 287 Song Library</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="images/g4v-logo.png">
</head>
<body>
    <div class="library-container">
        <!-- Modernized Header Box -->
        <div class="header-box">
            <div class="header-title-area">
                <h1>Chapter 287 Song Library</h1>
                <p id="songCount">Loading database...</p>
            </div>
            <a href="index.html" class="back-btn">&larr; Back to Dashboard</a>
        </div>

        <div class="search-bar-container">
            <input type="text" id="searchInput" placeholder="Search across all songs by title, artist, or lyrics..." onkeyup="handleSearch()">
        </div>

        <!-- Main Workspace Layout: Vertical Sidebar + Content Table -->
        <div class="library-layout">
            <aside class="alpha-sidebar">
                <button class="alpha-btn active" onclick="filterByLetter('ALL', this)">
                    <span>ALL</span> <span class="count" id="count-all">0</span>
                </button>
                <!-- Dedicated Christmas Filter Button -->
                <button class="alpha-btn christmas-btn" onclick="filterByCategory('christmas', this)">
                    <span>🎄 XMAS</span> <span class="count" id="count-christmas">0</span>
                </button>
                <div id="alphabetNav">
                    <!-- Dynamically populated vertical A-Z buttons -->
                </div>
            </aside>

            <main class="song-content-area">
                <table class="song-table">
                    <thead>
                        <tr>
                            <th class="col-title">Title</th>
                            <th class="col-artist">Artist</th>
                            <th class="col-action">View Page</th>
                        </tr>
                    </thead>
                    <tbody id="songTableBody">
                        <tr><td colspan="3" class="empty-state">Loading library...</td></tr>
                    </tbody>
                </table>
            </main>
        </div>
    </div>

    <!-- Song View Modal with Action Bar -->
    <div id="songModal" class="modal" style="display:none;">
        <div class="modal-content">
            <div class="modal-header">
                <div>
                    <h2 id="modalTitle"></h2>
                    <p id="modalArtist"></p>
                </div>
                <div class="modal-actions">
                    <button onclick="printSong()" class="action-btn" title="Print Song">&#128424; Print</button>
                    <button onclick="copySongText()" class="action-btn" title="Copy Text">&#128203; Copy</button>
                    <button onclick="downloadSong()" class="action-btn" title="Download File">&#128190; Download</button>
                    <button onclick="closeModal()" class="close-btn" title="Close">&times;</button>
                </div>
            </div>
            <div class="modal-body" id="modalBody"></div>
        </div>
    </div>

    <script>
        let allSongs = [];
        let currentActiveSong = null;
        let activeLetter = 'ALL';

        async function loadSongs() {
            try {
                let response = await fetch('songs.json');
                allSongs = await response.json();
                document.getElementById('songCount').innerText = `${allSongs.length} Songs Displayed`;
                document.getElementById('count-all').innerText = allSongs.length;
                buildVerticalAlphaSidebar();
                displaySongs(allSongs);
            } catch (error) {
                document.getElementById('songCount').innerText = 'Error loading database';
                document.getElementById('songTableBody').innerHTML = `<tr><td colspan="3" class="empty-state">Failed to load songs.json</td></tr>`;
            }
        }

        function buildVerticalAlphaSidebar() {
            const container = document.getElementById('alphabetNav');
            const alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");
            let html = '';
            
            alphabet.forEach(letter => {
                const count = allSongs.filter(s => s.title.toUpperCase().startsWith(letter)).length;
                html += `
                    <button class="alpha-btn ${count === 0 ? 'disabled' : ''}" onclick="filterByLetter('${letter}', this)">
                        <span>${letter}</span> <span class="count">${count}</span>
                    </button>`;
            });
            container.innerHTML = html;
        }

        function displaySongs(songsToDisplay) {
            const tbody = document.getElementById('songTableBody');
            if (songsToDisplay.length === 0) {
                tbody.innerHTML = `<tr><td colspan="3" class="empty-state">No songs found.</td></tr>`;
                return;
            }
            
            tbody.innerHTML = songsToDisplay.map(song => `
                <tr>
                    <td class="col-title"><strong>${song.title}</strong></td>
                    <td class="col-artist">${song.artist}</td>
                    <td class="col-action">
                        <button onclick='openSongModal(${JSON.stringify(song).replace(/'/g, "&#39;")})' class="view-btn">View Song &nearr;</button>
                    </td>
                </tr>
            `).join('');
        }

        function filterByLetter(letter, element) {
            activeLetter = letter;
            document.querySelectorAll('.alpha-sidebar button').forEach(b => b.classList.remove('active'));
            if (element) element.classList.add('active');
            
            let filtered = letter === 'ALL' ? allSongs : allSongs.filter(s => s.title.toUpperCase().startsWith(letter));
            
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            if (searchTerm) {
                filtered = filtered.filter(s => 
                    s.title.toLowerCase().includes(searchTerm) || 
                    s.artist.toLowerCase().includes(searchTerm) || 
                    s.content.some(line => line.toLowerCase().includes(searchTerm))
                );
            }
            displaySongs(filtered);
        }

        function handleSearch() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            let baseList = activeLetter === 'ALL' ? allSongs : allSongs.filter(s => s.title.toUpperCase().startsWith(activeLetter));
            
            const filtered = baseList.filter(s => 
                s.title.toLowerCase().includes(searchTerm) || 
                s.artist.toLowerCase().includes(searchTerm) || 
                s.content.some(line => line.toLowerCase().includes(searchTerm))
            );
            displaySongs(filtered);
        }

        function filterByCategory(category, element) {
                activeLetter = null; // Clear alphabetical filter
                document.querySelectorAll('.alpha-sidebar button').forEach(b => b.classList.remove('active'));
                if (element) element.classList.add('active');
                
                let filtered = allSongs.filter(s => s.is_christmas === true);
                
                const searchTerm = document.getElementById('searchInput').value.toLowerCase();
                if (searchTerm) {
                    filtered = filtered.filter(s => 
                        s.title.toLowerCase().includes(searchTerm) || 
                        s.artist.toLowerCase().includes(searchTerm) || 
                        s.content.some(line => line.toLowerCase().includes(searchTerm))
                    );
                }
                displaySongs(filtered);
            }

        function openSongModal(song) {
            currentActiveSong = song;
            document.getElementById('modalTitle').innerText = song.title;
            document.getElementById('modalArtist').innerText = song.artist;
            document.getElementById('modalBody').innerHTML = song.content.map(line => `<div class="lyric-line">${line}</div>`).join('');
            document.getElementById('songModal').style.display = 'block';
        }

        function closeModal() {
            document.getElementById('songModal').style.display = 'none';
        }

        function copySongText() {
            if (!currentActiveSong) return;
            const text = `${currentActiveSong.title}\nArtist: ${currentActiveSong.artist}\n\n` + currentActiveSong.content.join('\n');
            navigator.clipboard.writeText(text);
            alert('Song copied to clipboard!');
        }

        function downloadSong() {
            if (!currentActiveSong) return;
            const text = `${currentActiveSong.title}\nArtist: ${currentActiveSong.artist}\n\n` + currentActiveSong.content.join('\n');
            const blob = new Blob([text], { type: 'text/plain' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `${currentActiveSong.title.replace(/[^a-zA-Z0-9]/g, '_')}.txt`;
            link.click();
        }

        function printSong() {
            window.print();
        }

        loadSongs();
    </script>
</body>
</html>

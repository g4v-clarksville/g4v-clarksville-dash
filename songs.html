<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chapter 287 Song Library</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="images/g4v-logo.png">
</head>
<body>
    <div class="container">
        <div class="header-box">
            <div>
                <h1>Chapter 287 Song Library</h1>
                <p id="songCount">Loading database...</p>
            </div>
            <a href="index.html" class="back-btn">← Back to Dashboard</a>
        </div>

        <input type="text" id="searchInput" placeholder="Search across all songs by title, artist, or lyrics..." onkeyup="handleSearch()">
        
        <div class="alphabet-nav" id="alphabetNav">
            <!-- Dynamically populated A-Z buttons -->
        </div>

        <table class="song-table">
            <thead>
                <tr>
                    <th class="col-title">Title</th>
                    <th class="col-artist">Artist</th>
                    <th class="col-action">View Page</th>
                </tr>
            </thead>
            <tbody id="songTableBody">
                <tr><td colspan="3" class="empty-state">Loading library...</td></tr>
            </tbody>
        </table>
    </div>

    <script>
        let songs = [];
        let currentLetter = 'ALL';

        function isJunk(title, artist) {
            if (!title) return true;
            let t = title.trim();
            let a = artist ? artist.trim() : '';
            let upperT = t.toUpperCase();
            
            // 1. Basic length boundaries (Real song titles are rarely single characters or over 45 chars)
            if (t.length < 2 || t.length > 45) return true;
            
            // 2. Reject anything starting with or entirely consisting of parentheses/brackets/form markers
            if (t.startsWith('(') || t.startsWith('[') || t.startsWith('|') || t.startsWith('<')) return true;
            if (upperT.startsWith('INTRO') || upperT.startsWith('VERSE') || upperT.startsWith('CHORUS') || 
                upperT.startsWith('BRIDGE') || upperT.startsWith('SOLO') || upperT.startsWith('OUTRO') || 
                upperT.startsWith('FORM') || upperT.startsWith('TAB') || upperT.startsWith('PART')) return true;

            // 3. Reject timestamps, numbers-only, or timecodes
            if (/^\d{1,2}:\d{2}/.test(t)) return true;
            if (/^[\d\s\-\–—\.,:;]+$/.test(t)) return true;

            // 4. Reject vocalization filler lines or lyric fragments masquerading as titles ("Ahhh", "mmm - mmm")
            if (/^(ah+|oh+|mm+|la+|hey+|yeah+)[,\.\s!-]*$/i.test(t)) return true;
            if (/^(ah+|oh+|mm+|la+|hey+|yeah+)/i.test(t) && t.split(/\s+/).length <= 4) return true;

            // 5. Check for bad/corrupted artist fields (e.g. numbers, instructions, bracketed text)
            if (!a || a === 'Unknown Artist') {
                // If there's no artist, be extra strict on title validity
                if (t.includes('<') || t.includes('>') || t.includes('|')) return true;
            }
            if (/^\d+$/.test(a) || a.includes('>') || a.includes('<') || a.toLowerCase().includes('bridge')) return true;

            return false;
        }

        function cleanSongData(song, idx) {
            let title = song.title ? song.title.trim() : '';
            let artist = song.artist && song.artist !== 'Unknown Artist' ? song.artist.trim() : '';

            let match = title.match(/^(.*?)\s+[\–\-—]\s+(.+)$/);
            if (match) {
                title = match[1].trim();
                if (!artist) artist = match[2].trim();
            }

            return {
                ...song,
                title: title,
                artist: artist || 'Unknown Artist',
                originalIndex: idx
            };
        }

        fetch('songs.json')
            .then(res => res.json())
            .then(data => {
                songs = data
                    .map((s, idx) => cleanSongData(s, idx))
                    .filter(song => !isJunk(song.title, song.artist));

                songs.sort((a, b) => a.title.localeCompare(b.title, 'en', { sensitivity: 'base' }));

                buildAlphabetNav();
                filterAndRender();
            });

        function buildAlphabetNav() {
            let nav = document.getElementById('alphabetNav');
            let availableLetters = new Set(songs.map(s => s.title.charAt(0).toUpperCase()));

            let html = `<button class="letter-btn active" onclick="selectLetter('ALL')">ALL</button>`;
            for (let i = 65; i <= 90; i++) {
                let char = String.fromCharCode(i);
                let hasSongs = availableLetters.has(char);
                let btnClass = hasSongs ? 'letter-btn' : 'letter-btn disabled';
                let clickAction = hasSongs ? `onclick="selectLetter('${char}')"` : '';
                html += `<button class="${btnClass}" ${clickAction}>${char}</button>`;
            }
            nav.innerHTML = html;
        }

        function selectLetter(letter) {
            currentLetter = letter;
            document.getElementById('searchInput').value = '';
            
            document.querySelectorAll('.letter-btn').forEach(btn => {
                if (btn.innerText === letter) btn.classList.add('active');
                else btn.classList.remove('active');
            });

            filterAndRender();
        }

        function handleSearch() {
            if (document.getElementById('searchInput').value.trim() !== '') {
                currentLetter = 'ALL';
                document.querySelectorAll('.letter-btn').forEach(btn => {
                    if (btn.innerText === 'ALL') btn.classList.add('active');
                    else btn.classList.remove('active');
                });
            }
            filterAndRender();
        }

        function filterAndRender() {
            let query = document.getElementById('searchInput').value.toLowerCase();
            
            let filtered = songs.filter(s => {
                let matchesLetter = (currentLetter === 'ALL') || s.title.toUpperCase().startsWith(currentLetter);
                if (!matchesLetter) return false;

                if (!query) return true;
                return (s.title && s.title.toLowerCase().includes(query)) || 
                       (s.artist && s.artist.toLowerCase().includes(query)) ||
                       (s.content && s.content.some(line => line.toLowerCase().includes(query)));
            });

            renderTable(filtered);
        }

        function renderTable(arr) {
            let tbody = document.getElementById('songTableBody');
            document.getElementById('songCount').innerText = `${arr.length} Songs Displayed`;

            if (arr.length === 0) {
                tbody.innerHTML = `<tr><td colspan="3" class="empty-state">No matching songs found.</td></tr>`;
                return;
            }

            let html = '';
            arr.forEach((s) => {
                let title = s.title || 'Untitled';
                let artist = s.artist || 'Unknown Artist';
                let viewerUrl = `song.html?id=${s.originalIndex}`;

                html += `
                    <tr class="song-row" onclick="window.open('${viewerUrl}', '_blank')">
                        <td><strong class="song-title-text">${escapeHtml(title)}</strong></td>
                        <td class="song-artist-text">${escapeHtml(artist)}</td>
                        <td class="col-action">
                            <a href="${viewerUrl}" target="_blank" class="action-link" onclick="event.stopPropagation()">View Song ↗</a>
                        </td>
                    </tr>`;
            });
            tbody.innerHTML = html;
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>

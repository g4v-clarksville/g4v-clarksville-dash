<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chapter 287 Song Library</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="images/g4v-logo.png">
    <style>
        body { background-color: #121212; color: #e0e0e0; font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; }
        .header-box { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid #333; padding-bottom: 15px; }
        #searchInput { width: 100%; padding: 14px 18px; font-size: 16px; background: #1e1e1e; border: 1px solid #444; color: #fff; border-radius: 8px; margin-bottom: 20px; outline: none; transition: border 0.2s; box-sizing: border-box; }
        #searchInput:focus { border-color: #0d6efd; }
        .song-table { width: 100%; border-collapse: collapse; background: #1e1e1e; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .song-table th, .song-table td { padding: 12px 16px; text-align: left; border-bottom: 1px solid #2d2d2d; }
        .song-table th { background: #252525; color: #aaa; font-weight: 600; text-transform: uppercase; font-size: 12px; letter-spacing: 0.5px; }
        .song-table tr.song-row:hover { background: #262626; cursor: pointer; }
        .lyrics-modal { display: none; background: #181818; border: 1px solid #444; padding: 20px; margin-top: 10px; border-radius: 8px; white-space: pre-line; font-family: monospace; font-size: 14px; color: #d1d1d1; max-height: 400px; overflow-y: auto; }
        .actions a { color: #4dabf7; text-decoration: none; font-size: 13px; }
        .actions a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header-box">
            <div>
                <h1>Chapter 287 Song Library</h1>
                <p id="songCount" style="color: #888; margin: 0; font-size: 14px;">Loading database...</p>
            </div>
            <a href="index.html" style="color: #aaa; text-decoration: none; font-size: 14px;">← Back to Dashboard</a>
        </div>

        <input type="text" id="searchInput" placeholder="Search by title, artist, or lyric..." onkeyup="filterSongs()">
        
        <table class="song-table">
            <thead>
                <tr>
                    <th>Title</th>
                    <th>Artist</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="songTableBody">
                <tr><td colspan="3" style="text-align:center; color:#777;">Loading library...</td></tr>
            </tbody>
        </table>
    </div>

    <script>
        let songs = [];

        function isJunk(title) {
            if (!title) return true;
            let t = title.trim();
            if (t.length < 2) return true;
            if (/^[\*\-_=\.\—·#\/]+$/.test(t)) return true;
            let upper = t.toUpperCase();
            if (upper === "(MAIN)" || upper === "MAIN" || upper === "INDEX" || upper === "CONTENTS") return true;
            if (upper.startsWith("TIP:") || upper.startsWith("NOTE:") || upper.startsWith("INTRO:") || upper.startsWith("INSTRUCTIONS:")) return true;
            if (upper.includes("BY SONG TITLE") || upper.includes("POP/ROCK") || upper.includes("TITLES IN RED") || upper.includes("GENRE")) return true;
            if (t.startsWith("[") || t.startsWith("<")) return true;
            
            let words = t.split(/\s+/);
            let chordToken = /^[A-G][b#]?(m|maj|min|dim|aug|sus|7|9|11|13|2|4|add)*$/i;
            let chordCount = words.filter(w => chordToken.test(w) || ['-', '—', '/', 'and', '&', ';', ','].includes(w)).length;
            if (words.length >= 2 && chordCount / words.length >= 0.7) return true;

            if (/^[\-—\s]*[A-Z0-9][\-—\s]*$/.test(t) && t.length <= 5) return true;
            if (/^\(.*\)$/.test(t)) return true;
            return false;
        }

        fetch('songs.json')
            .then(res => res.json())
            .then(data => {
                songs = data
                    .filter(song => !isJunk(song.title))
                    .map((song, idx) => ({ ...song, originalIndex: idx }));
                
                document.getElementById('songCount').innerText = `${songs.length} Songs Indexed`;
                renderTable(songs);
            });

        function filterSongs() {
            let query = document.getElementById('searchInput').value.toLowerCase();
            if (!query) {
                renderTable(songs);
                return;
            }
            
            let filtered = songs.filter(s => 
                (s.title && s.title.toLowerCase().includes(query)) || 
                (s.artist && s.artist.toLowerCase().includes(query)) ||
                (s.content && s.content.some(line => line.toLowerCase().includes(query)))
            );
            
            renderTable(filtered);
        }

        function renderTable(arr) {
            let tbody = document.getElementById('songTableBody');
            if (arr.length === 0) {
                tbody.innerHTML = `<tr><td colspan="3" style="text-align:center; color:#777;">No matching songs found.</td></tr>`;
                return;
            }

            let html = '';
            arr.forEach((s) => {
                let title = s.title || 'Untitled';
                let artist = s.artist || 'Unknown Artist';
                let yt = s.youtube ? `<a href="${s.youtube}" target="_blank">YouTube</a>` : '';
                let lyricsText = s.content && s.content.length > 0 ? s.content.join('\n') : 'No lyrics stored for this song.';

                html += `
                    <tr class="song-row" onclick="toggleLyrics(${s.originalIndex})">
                        <td><strong>${escapeHtml(title)}</strong></td>
                        <td style="color: #aaa;">${escapeHtml(artist)}</td>
                        <td class="actions" onclick="event.stopPropagation()">${yt}</td>
                    </tr>
                    <tr id="lyrics-${s.originalIndex}" style="display:none;">
                        <td colspan="3">
                            <div class="lyrics-modal">${escapeHtml(lyricsText)}</div>
                        </td>
                    </tr>`;
            });
            tbody.innerHTML = html;
        }

        function toggleLyrics(originalIndex) {
            let row = document.getElementById(`lyrics-${originalIndex}`);
            if (row) {
                row.style.display = row.style.display === 'none' ? 'table-row' : 'none';
            }
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>

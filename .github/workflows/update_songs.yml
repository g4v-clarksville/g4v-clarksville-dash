name: Auto-Update Song Database

on:
  push:
    paths:
      - 'songs_txt/**'
  workflow_dispatch: # This adds the manual "Run workflow" button!

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Run Import Script
        run: python parse.songs.py
        
      - name: Commit and Push Database Changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Automatically update songs.json from new text files"
          file_pattern: songs.json
